<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Michael Mott</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
:root {
  /* QuillStack colors */
  --base: #0E0E0E;
  --container-low: #131313;
  --container: #1A1919;
  --on-surface: #E5E2E1;
  --on-surface-variant: #ADAAAA;
  --on-surface-muted: #737070;
  --primary: #E0E0E0;

  --font-sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.65;
  color: var(--on-surface-variant);
  background: var(--base);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 24px;
  position: relative;
  overflow: hidden;
}

/* Option 2: Subtle grain texture */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' /%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
  opacity: 0.4;
  pointer-events: none;
  z-index: 0;
}

/* Main container */
.container {
  max-width: 640px;
  width: 100%;
  position: relative;
  z-index: 1;
  text-align: center;
}

/* Option 4: Geometric accent lines - corner brackets */
.container::before,
.container::after {
  content: '';
  position: absolute;
  width: 60px;
  height: 60px;
  border: 1px solid var(--on-surface-muted);
  opacity: 0.3;
  pointer-events: none;
}

.container::before {
  top: -20px;
  left: -20px;
  border-right: none;
  border-bottom: none;
}

.container::after {
  bottom: -20px;
  right: -20px;
  border-left: none;
  border-top: none;
}

/* Hero */
h1 {
  font-family: var(--font-sans);
  font-weight: 300;
  font-size: clamp(2.4rem, 6vw, 3.6rem);
  line-height: 1.08;
  letter-spacing: -0.02em;
  color: var(--on-surface);
  margin-bottom: 20px;
  /* Option 1: Soft glow on heading */
  text-shadow: 0 0 40px rgba(224, 224, 224, 0.12), 0 0 80px rgba(224, 224, 224, 0.06);
}

h1 strong {
  font-weight: 600;
  color: var(--primary);
}

/* Line separator */
.separator {
  width: 60px;
  height: 1px;
  background: var(--on-surface-muted);
  margin: 40px auto;
  opacity: 0.4;
}

/* Tag chips - exact QuillStack styling */
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin-bottom: 56px;
}

.chip {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 6px 9px 5px 9px;
  border-radius: 0;
  line-height: 1;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s ease;
  position: relative;
  /* Option 1: Soft glow on chips */
  box-shadow: 0 0 12px rgba(0,0,0,0.3), 0 0 24px rgba(0,0,0,0.1);
}

.chip:hover {
  transform: translateY(-2px);
  /* Option 1: Enhanced glow on hover */
  box-shadow: 0 0 20px rgba(0,0,0,0.4), 0 4px 16px rgba(0,0,0,0.3), 0 0 40px rgba(0,0,0,0.15);
}

/* Option 3: Animated gradient border effect */
.chip::before {
  content: '';
  position: absolute;
  inset: -1px;
  background: linear-gradient(45deg,
    transparent 0%,
    rgba(224, 224, 224, 0.1) 50%,
    transparent 100%);
  background-size: 200% 200%;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
  animation: shimmer 3s linear infinite;
  z-index: -1;
}

.chip:hover::before {
  opacity: 1;
}

@keyframes shimmer {
  0% { background-position: 200% center; }
  100% { background-position: -200% center; }
}

/* Footer */
.footer-links {
  display: flex;
  gap: 20px;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.footer-links a {
  color: var(--on-surface-muted);
  text-decoration: none;
  transition: color 0.2s;
}

.footer-links a:hover {
  color: var(--primary);
}

/* Option 4: Decorative horizontal rule */
.chips::before {
  content: '';
  display: block;
  width: 40px;
  height: 1px;
  background: var(--on-surface-muted);
  margin: 0 auto 32px;
  opacity: 0.3;
}

.chips::after {
  content: '';
  display: block;
  width: 40px;
  height: 1px;
  background: var(--on-surface-muted);
  margin: 32px auto 0;
  opacity: 0.3;
}

/* Responsive */
@media (max-width: 560px) {
  body { padding: 32px 20px; }
  h1 { font-size: 2rem; }
  p.lede { font-size: 1rem; margin-bottom: 32px; }
  .chips { gap: 6px; margin-bottom: 48px; }
  .container::before,
  .container::after {
    width: 40px;
    height: 40px;
  }
}
  </style>
</head>
<body>
  <div class="container">
    <h1>Michael <strong>Mott</strong></h1>

    <div class="separator"></div>

    <!-- Navigation chips in exact QuillStack order/colors -->
    <div class="chips">
      <a href="mike-projects.html" class="chip" style="background:#D4FF00;color:#1A1C1C">PROJECTS</a>
      <a href="https://linkedin.com/in/michael-b-mott/" class="chip" style="background:#007AFF;color:#FFFFFF" target="_blank">LINKEDIN</a>
      <a href="mailto:mike@mottvt.com" class="chip" style="background:#FFC107;color:#1A1C1C">EMAIL</a>
      <a href="mike-blog.html" class="chip" style="background:#BB86FC;color:#1A1C1C">BLOG</a>
    </div>

    <div class="footer-links">
      <a href="https://github.com/mikemott" target="_blank">GitHub</a>
      <a href="https://quillstack.io" target="_blank">QuillStack</a>
    </div>
  </div>
</body>
</html>
