<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Michael Mott</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
:root {
  --base: #0E0E0E;
  --container-low: #131313;
  --container: #1A1919;
  --container-high: #222222;
  --on-surface: #E5E2E1;
  --on-surface-variant: #ADAAAA;
  --on-surface-muted: #737070;
  --primary: #E0E0E0;

  --font-sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --maxw: 860px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.65;
  color: var(--on-surface-variant);
  background: var(--base);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

a { color: var(--on-surface); text-decoration: none; }
a:hover { color: var(--primary); }

/* Header */
.site-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--container-low);
  border-bottom: 1px solid var(--container);
}
.site-header .inner {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 16px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.back-link {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--on-surface-muted);
  transition: color 0.2s;
}
.back-link:hover { color: var(--primary); }

/* Page content */
.wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 24px; }

.page-header {
  padding: 72px 0 56px;
  text-align: center;
}

.page-header h1 {
  font-family: var(--font-sans);
  font-weight: 300;
  font-size: clamp(2.4rem, 6vw, 3.6rem);
  line-height: 1.08;
  letter-spacing: -0.02em;
  color: var(--on-surface);
  margin-bottom: 16px;
}

.page-header p {
  font-size: 1.15rem;
  max-width: 30em;
  margin: 0 auto;
  color: var(--on-surface-variant);
}

/* Contact form */
.contact-form {
  max-width: 600px;
  margin: 0 auto 48px;
  background: var(--container-low);
  border: 1px solid var(--container);
  padding: 32px;
}

.form-group {
  margin-bottom: 24px;
}

.form-group label {
  display: block;
  margin-bottom: 8px;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--on-surface-muted);
}

.form-group input,
.form-group textarea {
  width: 100%;
  padding: 12px;
  background: var(--base);
  border: 1px solid var(--container);
  color: var(--on-surface);
  font-family: var(--font-sans);
  font-size: 15px;
  transition: all 0.2s;
}

.form-group input:focus,
.form-group textarea:focus {
  outline: none;
  border-color: var(--on-surface-muted);
  background: var(--container-low);
}

.form-group textarea {
  min-height: 140px;
  resize: vertical;
  font-family: var(--font-sans);
  line-height: 1.6;
}

.submit-btn {
  width: 100%;
  padding: 14px 24px;
  background: var(--on-surface);
  color: var(--base);
  border: none;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.2s;
}

.submit-btn:hover {
  background: var(--primary);
}

.submit-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.message {
  padding: 16px;
  margin-bottom: 24px;
  display: none;
  font-size: 14px;
  border-left: 3px solid;
}

.message.success {
  background: rgba(144, 238, 144, 0.1);
  border-color: #90EE90;
  color: #90EE90;
}

.message.error {
  background: rgba(232, 93, 117, 0.1);
  border-color: #E85D75;
  color: #E85D75;
}

/* Contact methods */
.contact-methods {
  max-width: 600px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 1px;
  background: var(--container);
  border: 1px solid var(--container);
  margin-bottom: 80px;
}

.contact-method {
  background: var(--base);
  padding: 24px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: background 0.2s;
}

.contact-method:hover {
  background: var(--container-low);
}

.contact-method-label {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--on-surface-muted);
}

.contact-method-value {
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--on-surface);
}

.contact-method-value a {
  color: var(--on-surface);
  text-decoration: none;
  border-bottom: 1px solid var(--container-high);
  transition: all 0.2s;
}

.contact-method-value a:hover {
  color: var(--primary);
  border-bottom-color: var(--primary);
}

/* Footer */
.site-footer {
  border-top: 1px solid var(--container);
  background: var(--container-low);
  padding: 32px 0;
}
.site-footer .inner {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 0 24px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 14px;
}
.site-footer .foot-links {
  display: flex;
  gap: 20px;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.site-footer .foot-links a { color: var(--on-surface-muted); }
.site-footer .foot-links a:hover { color: var(--primary); }

@media (max-width: 560px) {
  .site-header .inner { padding: 16px 20px; }
  .page-header { padding: 48px 0 40px; }
  .contact-form { padding: 24px 20px; }
  .contact-method {
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
  }
}
  </style>
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <a href="index.html" class="back-link">← Back</a>
    </div>
  </header>

  <main class="wrap">
    <div class="page-header">
      <h1>Get in Touch</h1>
      <p>Have a question or want to work together? Send me a message.</p>
    </div>

    <div class="contact-form">
      <div id="message" class="message"></div>

      <form id="contactForm">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="message-text">Message</label>
          <textarea id="message-text" name="message" required></textarea>
        </div>

        <div class="form-group">
          <div class="cf-turnstile" data-sitekey="0x4AAAAAAB5rM7FYn2o8jaNV" data-theme="dark"></div>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">Send Message</button>
      </form>
    </div>

    <div class="contact-methods">
      <div class="contact-method">
        <div class="contact-method-label">Email</div>
        <div class="contact-method-value">
          <a href="mailto:mike@mottvt.com">mike@mottvt.com</a>
        </div>
      </div>
      <div class="contact-method">
        <div class="contact-method-label">LinkedIn</div>
        <div class="contact-method-value">
          <a href="https://linkedin.com/in/michael-b-mott/" target="_blank">michael-b-mott</a>
        </div>
      </div>
      <div class="contact-method">
        <div class="contact-method-label">GitHub</div>
        <div class="contact-method-value">
          <a href="https://github.com/mikemott" target="_blank">@mikemott</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="inner">
      <div class="foot-links">
        <a href="index.html">Home</a>
        <a href="mike-projects.html">Projects</a>
        <a href="mike-blog.html">Blog</a>
      </div>
    </div>
  </footer>

  <script>
    const WORKER_URL = 'https://mottvt-worker.mikebmott.workers.dev';

    document.getElementById('contactForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const form = e.target;
      const submitBtn = document.getElementById('submitBtn');
      const messageDiv = document.getElementById('message');

      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';

      const turnstileToken = document.querySelector('[name="cf-turnstile-response"]')?.value;

      if (!turnstileToken) {
        messageDiv.textContent = 'Please complete the verification challenge.';
        messageDiv.className = 'message error';
        messageDiv.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Message';
        return;
      }

      const formData = {
        name: form.name.value,
        email: form.email.value,
        message: form['message'].value,
        turnstileToken: turnstileToken
      };

      try {
        const response = await fetch(`${WORKER_URL}/api/contact`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(formData)
        });

        const data = await response.json();

        if (response.ok) {
          messageDiv.textContent = data.message;
          messageDiv.className = 'message success';
          messageDiv.style.display = 'block';
          form.reset();
        } else {
          messageDiv.textContent = data.error || 'Something went wrong. Please try again.';
          messageDiv.className = 'message error';
          messageDiv.style.display = 'block';
        }
      } catch (error) {
        console.error('Error:', error);
        messageDiv.textContent = 'Failed to send message. Please try again or email me directly at mike@mottvt.com';
        messageDiv.className = 'message error';
        messageDiv.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Message';
      }
    });
  </script>
</body>
</html>
